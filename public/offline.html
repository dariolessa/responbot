<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sin conexión · Responbot</title>
    <style>
      :root { color-scheme: light dark; }
      body { margin: 0; min-height: 100dvh; display: flex; align-items: center; justify-content: center; padding: 24px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: #fff; color: #18181b; text-align: center; }
      @media (prefers-color-scheme: dark) { body { background: #09090b; color: #fafafa; } p { color: #a1a1aa; } }
      img { width: 56px; height: 56px; }
      h1 { font-size: 20px; font-weight: 600; margin: 20px 0 8px; }
      p { margin: 0 0 24px; color: #52525b; font-size: 15px; line-height: 1.5; }
      button { height: 44px; padding: 0 20px; border: 0; border-radius: 8px; background: #059669; color: #fff; font-size: 15px; font-weight: 500; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <h1>Estás sin conexión</h1>
      <p>Cuando vuelva internet, tu agenda se actualiza sola.</p>
      <button type="button" onclick="location.reload()">Reintentar</button>
    </main>
  </body>
</html>
